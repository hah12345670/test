<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态多维比例配置与方差系统</title>
    <style>
        :root {
            --primary-color: #d9534f;
            --primary-hover: #c9312c33;
            --bg-color: #f4f7f6;
            --border-color: #ddd;
            --card-bg: #fff;
            --text-main: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            padding: 10px;
            color: var(--text-main);
        }

        h2 {
            margin: 10px 0 15px;
            font-size: 20px;
            text-align: center;
        }

        .config-panel, .action-btn, .tip-box {
            width: 100%;
            max-width: 950px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        /* 折叠面板专属样式 */
        .config-panel {
            background-color: var(--card-bg);
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            color: #444;
            overflow: hidden;
        }

        .config-summary {
            font-size: 15px;
            font-weight: bold;
            color: var(--primary-color);
            padding: 12px;
            background-color: #f8f9fa;
            cursor: pointer;
            user-select: none;
            outline: none;
            border-bottom: 1px solid #f0f0f0;
        }

        .config-summary:hover {
            background-color: #eef2f7;
        }

        .config-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .config-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            border-bottom: 1px dashed #eee;
            padding-bottom: 8px;
        }
        .config-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .config-title {
            font-weight: bold;
            color: var(--primary-color);
            width: 100%;
        }

        .checkbox-label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f8f9fa;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-size: 13px;
        }
        .checkbox-label input {
            cursor: pointer;
        }

        /* 范围选择样式 */
        .range-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8f9fa;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-size: 13px;
        }
        .range-box input[type="number"] {
            width: 50px;
            padding: 2px 4px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            font-size: 13px;
        }

        button.action-btn {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: var(--primary-color);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: background-color 0.2s;
        }

        /* 【防抖关键点 1】为表格容器锁死最小高度，防止清空数据时页面坍塌 */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            min-height: 310px;
        }

        table {
            border-collapse: collapse;
            background-color: var(--card-bg);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
            min-width: 340px; 
        }

        td {
            border: 1px solid var(--border-color);
            width: 38px;
            height: 38px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .selected-target {
            color: var(--primary-color) !important;
            background-color: #fff3cd !important;
            border: 2px solid #f0ad4e !important;
            font-size: 15px;
        }

        @media (min-width: 600px) {
            .config-title {
                min-width: 140px;
                width: auto;
            }
        }

        @media (min-width: 768px) {
            td {
                width: 48px;
                height: 48px;
                font-size: 16px;
            }
            .selected-target {
                font-size: 18px;
            }
            /* PC 端调大对应最小高度 */
            .table-container {
                min-height: 390px;
            }
        }

        /* 【防抖关键点 2】为提示框锁死最小高度 */
        .tip-box {
            background-color: var(--card-bg);
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #result-tip {
            font-size: 14px;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 4px;
            line-height: 1.4;
            word-break: break-all;
        }
        #tier-tip {
            font-size: 12px;
            color: #0275d8;
            line-height: 1.4;
            word-break: break-all;
        }
        #group-detail-tip {
            font-size: 12px;
            color: #5bc0de;
            margin-top: 4px;
            line-height: 1.4;
            word-break: break-all;
        }
        #history-container {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            text-align: left;
            border-top: 1px dashed #eee;
            padding-top: 6px;
        }

        /* --- 底部数据统计表专属样式 --- */
        .stat-section-wrapper {
            width: 100%;
            max-width: 950px;
            margin-top: 10px;
            min-height: 150px;
        }
        .stat-table-container {
            width: 100%;
            overflow-x: auto;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            -webkit-overflow-scrolling: touch;
        }
        .stat-table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            text-align: center;
            font-size: 13px;
        }
        .stat-table th, .stat-table td {
            border: 1px solid var(--border-color);
            padding: 8px 4px;
            white-space: nowrap;
            width: auto;
            height: auto;
        }
        .stat-table th {
            background-color: var(--primary-color);
            color: #fff;
            font-weight: bold;
        }
        .stat-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        .stat-table td.intersection-cell {
            white-space: nowrap;
            font-size: 12px;
            color: #d9534f;
            text-align: center;
            padding: 6px 8px;
        }

        @media (max-width: 767px) {
            .stat-table {
                font-size: 12px;
            }
            .stat-table th, .stat-table td {
                padding: 6px 4px;
            }
        }
    </style>
</head>
<body>

    <h2>动态多维比例配置与方差系统</h2>
    
    <details class="config-panel">
        <summary class="config-summary">⚙️ 配置参数设置</summary>
        <div class="config-content" id="configPanel"></div>
    </details>

    <button class="action-btn" onclick="generateByCheckedConfigs()">点击按勾选的配置项组合执行筛选</button>
    
    <!-- 表格恢复在上 -->
    <div class="table-container">
        <table id="matrixTable">
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- 提示框恢复在下 -->
    <div class="tip-box">
        <div id="result-tip">提示：请勾选上方需要的配置选项，系统将动态抽取设定数量的核心数字执行匹配</div>
        <div id="tier-tip"></div>
        <div id="group-detail-tip"></div>
        <div id="history-container"></div>
    </div>

    <!-- 多维指标统计模块 -->
    <div class="stat-section-wrapper">
        <div class="stat-table-container">
            <table class="stat-table" id="statResultTable">
                <thead>
                    <tr>
                        <th>期号</th>
                        <th>个数</th>
                        <th>交集数组</th>
                        <th>012路比<br><small>(0:1:2)</small></th>
                        <th>奇偶比<br><small>(奇:偶)</small></th>
                        <th>三区比<br><small>(一:二:三)</small></th>
                        <th>质合比<br><small>(质:合)</small></th>
                        <th>象限比<br><small>(Q1:Q2:Q3:Q4)</small></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="myIntervalContainer"></div>

    <script src="tj_sx.js"></script><script src="kl8_tj.js"></script><script src="tj_sx1.js"></script><script src="kl8_tj2.js"></script><script src="kl8_tj1.js"></script><script src="kl8_tj3.js"></script><script src="tracker.js"></script>

</body>
</html>
