<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>He7推荐</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 4px;
        }

        h2 {
            font-size: 14px;
            text-align: center;
            margin: 4px 0 6px 0;
            color: #333;
        }

        /* 顶部控制栏 */
        .control-bar {
            margin-bottom: 6px;
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            background-color: #1890ff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* 统计看板样式 */
        .stats-panel {
            background: #fff;
            margin-bottom: 6px;
            padding: 6px 8px;
            border-radius: 5px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            font-size: 11px;
            color: #333;
        }
        .stats-title {
            font-weight: bold;
            margin-bottom: 4px;
            text-align: center;
            color: #555;
        }
        .stats-content {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .stat-badge {
            padding: 2px 6px;
            border-radius: 3px;
            color: #fff;
            font-weight: bold;
            font-size: 10px;
        }
        .stat-hot { background: #ff4d4f; }
        .stat-warm { background: #faad14; }
        .stat-cold { background: #1890ff; }

        /* 行布局 */
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            margin-bottom: 4px;
            padding: 4px 6px;
            border-radius: 5px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            width: 100%;
            white-space: nowrap;
        }

        .qihao {
            font-weight: bold;
            color: #333;
            font-size: 11px;
            width: 12%;
            text-align: left;
        }

        .numbers-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 76%;
            padding: 0 2px;
        }
        
        .section {
            display: flex;
            gap: 1vw;
            justify-content: center;
        }
        
        .section-separator {
            width: 1.5vw;
            flex-shrink: 0;
        }

        .num-box {
            width: 5.2vw;
            height: 5.2vw;
            max-width: 28px;
            max-height: 28px;
            min-width: 16px;
            min-height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            font-weight: bold;
            font-size: 2.5vw;
            color: #fff;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        /* 选中状态样式 */
        .num-box.active-selected {
            border: 1px solid #fff;
            box-shadow: 0 0 4px rgba(0,0,0,0.4);
            transform: scale(1.08);
            z-index: 2;
        }

        .hot { background: linear-gradient(135deg, #ff6b6b, #ff4d4f); }
        .warm { background: linear-gradient(135deg, #ffbb33, #faad14); }
        .cold { background: linear-gradient(135deg, #40a9ff, #1890ff); }
        
        .transparent { opacity: 0.15; box-shadow: none !important; transform: none !important; }
        
        .rule-result {
            width: 12%;
            display: flex;
            justify-content: flex-end;
        }
        
        .rule-box {
            width: 5.6vw;
            height: 5.6vw;
            max-width: 30px;
            max-height: 30px;
            min-width: 18px;
            min-height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            font-weight: bold;
            font-size: 2.7vw;
            color: #fff;
            cursor: pointer;
            user-select: none;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.2s ease;
        }

        .rule-box.active-selected {
            border: 1px solid #fff;
            box-shadow: 0 0 4px rgba(0,0,0,0.4);
            transform: scale(1.08);
            z-index: 2;
        }
        
        .rule-box.question {
            background: linear-gradient(135deg, #b0b0b0, #8c8c8c);
            border: 1px dashed #fff;
        }

        /* 电脑端平板适配 */
        @media (min-width: 768px) {
            body { padding: 20px; }
            h2 { font-size: 22px; margin-bottom: 15px; }
            .stats-panel { padding: 12px 15px; font-size: 14px; margin-bottom: 12px; }
            .stat-badge { font-size: 13px; padding: 3px 8px; }
            .row { padding: 10px 15px; margin-bottom: 10px; }
            .qihao { font-size: 14px; width: 70px; }
            .numbers-container { width: auto; flex-grow: 1; justify-content: flex-start; gap: 8px; padding: 0 15px; }
            .section { gap: 6px; }
            .section-separator { width: 12px; }
            .num-box { width: 32px; height: 32px; max-width: none; max-height: none; font-size: 13px; border-radius: 6px; }
            .rule-result { width: 60px; }
            .rule-box { width: 32px; height: 32px; max-width: none; max-height: none; font-size: 13px; border-radius: 6px; }
        }
    </style>
</head>
<body>

    <h2>He7推荐</h2>
    
    <div class="control-bar">
        <button class="btn" id="btn-show-all">全部显示</button>
        <button class="btn" id="btn-show-rule">显示规则</button>
    </div>

    <!-- 实时统计看板 -->
    <div class="stats-panel">
        <div class="stats-title" id="stats-title">当前显示数据统计（热 / 温 / 冷）</div>
        <div class="stats-content">
            <div class="stat-item">
                <span class="stat-badge stat-hot">热</span>
                <span id="stat-hot-text">个数: 0 (0.0%)</span>
            </div>
            <div class="stat-item">
                <span class="stat-badge stat-warm">温</span>
                <span id="stat-warm-text">个数: 0 (0.0%)</span>
            </div>
            <div class="stat-item">
                <span class="stat-badge stat-cold">冷</span>
                <span id="stat-cold-text">个数: 0 (0.0%)</span>
            </div>
        </div>
        
        <!-- 规则结果落点位置统计容器 -->
        <div style="margin-top: 8px; border-top: 1px dashed #eee; padding-top: 6px;">
            <!-- 标题和控制项放在同一行并居中，默认显示3个 -->
            <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 4px; font-size: 11px; flex-wrap: wrap;">
                <span style="font-weight: bold; color: #555;">规则结果落点位置统计</span>
                <span style="color: #666; margin-left: 4px;">显示名数:</span>
                <input type="number" id="pos-show-count-input" min="1" max="12" value="5" style="width: 38px; text-align: center; font-size: 11px; padding: 1px; border: 1px solid #d9d9d9; border-radius: 3px;">
                <button id="pos-update-btn" style="background: #1890ff; color: #fff; border: none; border-radius: 3px; padding: 2px 6px; font-size: 10px; cursor: pointer;">应用</button>
            </div>
            <div id="stat-top3-container" style="display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: #333;">
                <div style="text-align: left; padding: 3px 6px; background: #fafafa; border-radius: 3px;"><span style="font-weight: bold; color: #1890ff;">第1名</span>: 暂无</div>
            </div>
        </div>

        <!-- 任意位置组合的最高命中概率统计 -->
        <div style="margin-top: 8px; border-top: 1px dashed #eee; padding-top: 6px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <div style="font-weight: bold; color: #555; flex-grow: 1; text-align: center;">任意位置组合命中概率</div>
            </div>
            <!-- 位置修改及显示名数控制行 -->
            <div style="display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 6px; font-size: 10px; flex-wrap: wrap;">
                <span style="color: #666;">组合(K):</span>
                <input type="number" id="combo-k-input" min="1" max="12" value="7" style="width: 32px; text-align: center; font-size: 11px; padding: 1px; border: 1px solid #d9d9d9; border-radius: 3px;">
                <span style="color: #666;">位置:</span>
                <input type="text" id="combo-custom-input" placeholder="例如:1,2,3" style="width: 70px; font-size: 10px; padding: 1px 4px; border: 1px solid #d9d9d9; border-radius: 3px;">
                <span style="color: #666;">显示名数:</span>
                <input type="number" id="combo-show-count-input" min="1" max="495" value="1" style="width: 38px; text-align: center; font-size: 11px; padding: 1px; border: 1px solid #d9d9d9; border-radius: 3px;">
                <button id="combo-update-btn" style="background: #1890ff; color: #fff; border: none; border-radius: 3px; padding: 2px 6px; font-size: 10px; cursor: pointer;">应用</button>
            </div>
            <div id="stat-pos-combo-container" style="display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: #333;">
                <div style="text-align: left; padding: 3px 6px; background: #fafafa; border-radius: 3px;"><span style="font-weight: bold; color: #52c41a;">第1名</span>: 暂无</div>
            </div>
        </div>
    </div>

    <div id="data-container"></div>

    <script src="arr_he7tj.js"></script>
    <script src="he7_tj.js"></script>
    <script src="he7_tj1.js"></script>
</body>
</html>
